<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d5b">
  <title>Rodokmeňovec</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='22' r='18' fill='%2340916c'/%3E%3Crect x='28' y='34' width='8' height='24' rx='3' fill='%23845c3c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <!-- Úvodná obrazovka -->
  <section id="welcome" class="welcome">
    <div class="welcome-card">
      <div class="logo-big">🌳</div>
      <h1>Rodokmeňovec</h1>
      <p class="muted">Rodinný strom, ktorý patrí len vám. Dáta ostávajú na vašom disku.</p>
      <div id="welcome-actions"></div>
      <p id="welcome-msg" class="muted small"></p>
    </div>
  </section>

  <!-- Aplikácia -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand" title="Rodokmeňovec">🌳 <span>Rodokmeňovec</span></div>
      <nav class="tabs" id="tabs">
        <button data-view="tree" class="active"><span class="ico">🌳</span><span>Strom</span></button>
        <button data-view="people"><span class="ico">👥</span><span>Ľudia</span></button>
        <button data-view="photos"><span class="ico">🖼️</span><span>Fotky</span></button>
        <button data-view="stats"><span class="ico">📊</span><span>Štatistiky</span></button>
        <button data-view="relation"><span class="ico">🔗</span><span class="long">Príbuzenstvo</span><span class="short">Vzťahy</span></button>
      </nav>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Hľadať osobu…" autocomplete="off">
        <div id="search-results" class="dropdown hidden"></div>
      </div>
      <div class="top-actions">
        <button id="btn-undo" class="icon-btn" title="Vrátiť poslednú zmenu" disabled>↶<span class="long"> Späť</span></button>
        <span id="save-status" class="save-status"></span>
        <div class="menu-wrap">
          <button id="btn-menu" class="icon-btn" title="Ďalšie možnosti">☰</button>
          <div id="main-menu" class="dropdown menu hidden">
            <button data-act="home">Prejsť na domovskú osobu</button>
            <button data-act="save">Uložiť znova</button>
            <button data-act="export">Stiahnuť GEDCOM (záloha / iný program)</button>
            <button data-act="print">Tlačiť strom</button>
            <button data-act="reload">Znova načítať</button>
            <button data-act="switch">Otvoriť iný rodokmeň / odhlásiť</button>
            <button data-act="help">Pomoc</button>
          </div>
        </div>
      </div>
    </header>

    <main id="main">
      <section id="view-tree" class="view view-tree">
        <div id="tree-canvas" class="tree-canvas">
          <div id="tree-world" class="tree-world"></div>
        </div>
        <div class="tree-controls">
          <label title="Počet generácií predkov"><span class="long">Predkovia</span><span class="short">▲</span>
            <select id="gen-up"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
          </label>
          <label title="Počet generácií potomkov"><span class="long">Potomkovia</span><span class="short">▼</span>
            <select id="gen-down"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
          </label>
          <button id="zoom-out" class="icon-btn" title="Oddialiť">−</button>
          <button id="zoom-reset" class="icon-btn" title="Vycentrovať na vybranú osobu">stred</button>
          <button id="zoom-in" class="icon-btn" title="Priblížiť">+</button>
        </div>
        <button id="fab-profile" class="fab">👤 Profil</button>
        <aside id="profile" class="profile"></aside>
      </section>
      <section id="view-people" class="view hidden"></section>
      <section id="view-photos" class="view hidden"></section>
      <section id="view-stats" class="view hidden"></section>
      <section id="view-relation" class="view hidden"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app/config.js"></script>
  <script src="app/gedcom.js"></script>
  <script src="app/model.js"></script>
  <script src="app/storage.js"></script>
  <script src="app/drive.js"></script>
  <script src="app/ui-common.js"></script>
  <script src="app/tree.js"></script>
  <script src="app/profile.js"></script>
  <script src="app/editors.js"></script>
  <script src="app/views.js"></script>
  <script src="app/main.js"></script>
</body>
</html>
